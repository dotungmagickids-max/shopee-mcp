<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b4b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Xưởng MK">
<link rel="manifest" href="/xuong/manifest.webmanifest">
<link rel="apple-touch-icon" href="/xuong/icon-192.png">
<meta name="robots" content="noindex,nofollow">
<title>Magickids – Hàng xưởng</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#14171c;--mut:#5b6472;--line:#d9dde3;--accent:#0f7b4b;--red:#c62828;--amber:#b26a00}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
header{background:var(--accent);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
header button{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff;padding:7px 12px}
.thu{background:#ffe6b3;color:#6b3f00;padding:8px 14px;font-weight:600;font-size:14px}
main{max-width:760px;margin:0 auto;padding:12px}
.info{color:var(--mut);font-size:14px;margin:0 0 10px}
.info.err{color:var(--red);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{color:var(--mut);font-size:13px}
.kpi.bad b{color:var(--red)}
.tabs{display:flex;gap:6px;margin-bottom:12px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2;overflow-x:auto}
.tabs button{flex:1 0 auto;padding:10px 10px;font-size:15px;white-space:nowrap}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.loc button{padding:6px 12px;font-size:14px;border-radius:999px}
.locthang{margin-bottom:8px}
.locthang select{margin-left:8px;padding:6px 8px;font-size:15px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.nhapdon{margin:8px 0 4px}
.loc button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.card>summary{cursor:pointer;padding:10px 12px;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.card[open]>summary{border-bottom:1px solid var(--line)}
.card .d{padding:10px 12px}
.card .d>div{margin:6px 0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.code{font-family:Consolas,monospace;font-weight:700;font-size:17px}
.m{color:var(--mut);font-size:14px}
.late{color:var(--red);font-weight:700}
.ok{color:var(--accent);font-weight:700}
.amber{color:var(--amber);font-weight:700}
.hd{display:flex;gap:10px;align-items:flex-start}
.hd>div{flex:1;min-width:0}
.thumb{width:56px;height:56px;flex:none;border-radius:8px;object-fit:cover;background:#eceff3;border:1px solid var(--line)}
.owe{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;background:#e6e9ee;border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--accent)}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.nums div{background:#f6f7f9;border-radius:8px;padding:6px 2px}
.nums b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.nums span{font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--mut);font-size:12px}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.z{color:#b6bcc6}
td.hot{color:var(--red);font-weight:700}
.sec{font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;margin:14px 0 6px}
.form{border-top:1px dashed var(--line);padding-top:6px;margin-top:10px}
.form h3{font-size:15px;margin:8px 0 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{margin-top:8px;font-size:14px;font-weight:600}
.msg.err{color:var(--red)}
.msg.ok{color:var(--accent)}
.msg.amber{color:var(--amber)}
.note{background:#fff8e6;border:1px solid #f0d48a;border-radius:8px;padding:8px 10px;font-size:14px;color:#6b3f00}
#gate{max-width:420px;margin:40px auto;padding:16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
#gate h2{margin:0 0 6px;font-size:20px}
#gate button{width:100%;margin-top:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
table.nhap td{padding:3px}
table.nhap input{padding:7px 4px;text-align:right;min-width:52px}
table.nhap input.mau{text-align:left;min-width:96px}
table.nhap button{padding:4px 10px}
#sheet{background:#fff;color:#000;border:1px solid var(--line);border-radius:6px;padding:28px 30px;font:14px/1.5 "Times New Roman",Times,serif;overflow-x:auto}
#sheet .sh-dau{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px}
#sheet .sh-ten{font-size:18px;font-weight:700;text-transform:uppercase}
#sheet .sh-phai{text-align:right;white-space:nowrap}
#sheet .sh-td{font-size:20px;font-weight:700}
#sheet .sh-tt{margin-bottom:12px}
#sheet .sh-nhan{color:#333;font-style:italic;font-weight:400}
#sheet table.sh-bang{font-size:14px;margin:6px 0 12px}
#sheet table.sh-bang th,#sheet table.sh-bang td{border:1px solid #000;padding:5px 7px;color:#000;font-size:14px}
#sheet table.sh-bang th{background:#eee;font-weight:700}
#sheet td.wrap{white-space:normal}
#sheet tr.sh-tong td{font-weight:700}
#sheet .sh-doan{margin:6px 0;white-space:pre-wrap}
#sheet .sh-ky{display:grid;grid-template-columns:1fr 1fr;text-align:center;margin-top:26px;min-height:120px}
#sheet .sh-ten-ky{margin-top:70px;font-weight:700}
@media(max-width:480px){.cards{grid-template-columns:1fr 1fr}.kpi b{font-size:26px}.tabs button{font-size:14px}.row3{grid-template-columns:1fr 1fr}#sheet{padding:16px 14px}#sheet>*{min-width:520px}}
.caiApp{display:flex;gap:8px;align-items:center;background:#e8f5ee;border:1px solid #b9dcc8;border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:14px}
.caiApp span{flex:1}
.caiApp button{padding:6px 10px;font-size:14px}
.tabs button i{font-style:normal}
.tabs button .ngan{display:none}
@media(max-width:600px){
  header{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top))}
  header h1{font-size:16px}
  main{padding:10px 10px calc(76px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;top:auto;margin:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px;background:#fff;border-top:1px solid var(--line);z-index:5;overflow:visible}
  .tabs button{flex:1 1 0;min-width:0;padding:8px 2px;font-size:12px;line-height:1.2;white-space:normal;border-radius:10px;min-height:46px}
  .tabs button .dai{display:none}
  .tabs button .ngan{display:inline}
  .loc button{padding:9px 14px;font-size:15px}
  button{min-height:42px}
  table.nhap input{padding:9px 4px;min-width:56px;font-size:16px}
  .thumb{width:52px;height:52px}
}
@media print{
  .caiApp{display:none!important}
  @page{size:A4;margin:14mm}
  body{background:#fff}
  header,.thu,#gate,#info,#cards,#tabs,.noprint{display:none!important}
  main{max-width:none;margin:0;padding:0}
  #sheet{border:0;border-radius:0;padding:0;overflow:visible}
  #sheet>*{min-width:0}
}
</style>
</head>
<body>
<header>
  <h1>Magickids · Hàng xưởng</h1>
  <button id="btnReload" type="button">Tải lại</button>
  <button id="btnKey" type="button">Đăng xuất</button>
</header>
<div class="thu" id="thuBar" hidden>Bản chạy thử: số liệu giả, lưu thử chỉ nằm trong máy này, không gửi lên máy chủ.</div>

<div id="gate" hidden>
  <h2>Đăng nhập</h2>
  <div class="m">Nhập mật khẩu Magickids đã đặt cho xưởng (mã truy cập cũ cũng dùng được). Máy nhớ đăng nhập 60 ngày.</div>
  <label for="keyIn">Mật khẩu</label>
  <input id="keyIn" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false">
  <div class="msg err" id="gateMsg"></div>
  <button class="primary" id="keyOk" type="button">Đăng nhập</button>
</div>

<main id="app" hidden>
  <div class="caiApp" id="caiApp" hidden><span id="caiTxt"></span><button type="button" id="caiNut" hidden>Cài</button><button type="button" id="caiDong">Ẩn</button></div>
  <p class="info" id="info"></p>
  <div class="cards" id="cards"></div>
  <div class="tabs" id="tabs">
    <button type="button" data-t="don"><i class="dai">Đơn đã nhận</i><i class="ngan">Đơn</i></button>
    <button type="button" data-t="tra"><i class="dai">Tiến độ trả hàng</i><i class="ngan">Tiến độ</i></button>
    <button type="button" data-t="sua"><i class="dai">Cập nhật tiến độ</i><i class="ngan">Cập nhật</i></button>
    <button type="button" data-t="nhap"><i class="dai">Nhập phiếu</i><i class="ngan">Nhập phiếu</i></button>
    <button type="button" data-t="phieu"><i class="dai">Làm phiếu</i><i class="ngan">Làm phiếu</i></button>
  </div>
  <div id="body"></div>
</main>

<script>
'use strict';
/* Trang cho xưởng: đơn đã nhận, tiến độ trả hàng, xưởng tự cập nhật ngày hẹn và thông tin sản xuất.
   Chỉ gọi /api/xuong (GET đọc sổ đã bỏ giá, POST ghi ngày hẹn / thông tin sản xuất). Thêm ?thu=1 để chạy thử bằng số giả.
   Màn Làm phiếu (đặt vải, đặt in thêu, giao may): phiếu lưu trên máy và trên máy chủ. */
const THU=new URLSearchParams(location.search).has('thu');
/* máy cảm ứng màn nhỏ: hiện nút chụp ảnh bằng camera, gợi ý cài lên màn hình chính */
const DI_DONG=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<=820;
const API='/api/xuong';
const CHUA_BAT='Máy chủ chưa bật phần ghi thông tin sản xuất';
const $=id=>document.getElementById(id);
const mk=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x;};
const store={
  get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},
  set(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
};
const S={key:store.get('mk_xuong_key'),ten:store.get('mk_xuong_ten'),tab:'tra',data:null,at:0,busy:false,err:'',anh:{},anhAt:0,
  loc:{don:'mo',tra:'cho'},thang:'',open:new Set(),saved:null,chuaBat:false};

const num=n=>n==null?'—':Number(n).toLocaleString('vi-VN');
const day=(iso,nam)=>{if(!iso)return '';const p=String(iso).slice(0,10).split('-');return p[2]+'/'+p[1]+(nam?'/'+p[0]:'');};
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const homNay=()=>new Date(Date.now()+7*3600000).toISOString().slice(0,10);
const soNgay=(tu,den)=>Math.round((Date.parse(den+'T00:00:00Z')-Date.parse(tu+'T00:00:00Z'))/86400000);

/* ---------- số giả cho bản chạy thử ---------- */
function mock(){
  const hn=homNay(),lui=n=>new Date(Date.parse(hn+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
  const mt=(sizes,hang)=>{hang=hang.map(([mau,o])=>({mau,o,tong:o.reduce((a,b)=>a+(b||0),0)}));const tong=sizes.map((_,i)=>hang.reduce((a,h)=>a+(h.o[i]||0),0));return {sizes,hang,tong,tongCong:tong.reduce((a,b)=>a+b,0)};};
  const sx0={ngayChot:null,veDau:null,veDu:null,chotDenCat:null,chotDenVeDau:null,chotDenVeDu:null,daQua:null,xuong:'',vaiVe:null,thongTin:''};
  const lo=(id,ma,l,phieuId,soCat,daGiao,khoDem,henTra,x)=>Object.assign({id,ma,lo:l,phieuId,mau:'',soCat,daGiao,khoDem,choKhoDem:Math.max(0,daGiao-khoDem),conNo:soCat-khoDem,ngayTre:0,henTra,ngayCat:lui(-20),trangThai:'dang_ve',nhan:{k:'idle',t:''},choVe:soCat>khoDem,maTran:null,theoMau:[],lanVe:[],doiHen:[],sx:Object.assign({},sx0)},x||{});
  const los=[
    lo(1,'MA26001','L1',1,192,89,77,lui(-3),{maTran:mt(['130','140','150','160'],[['Đỏ',[11,8,32,54]],['Trắng',[0,8,2,null]]]),
      lanVe:[{ngay:lui(-2),giao:77,khoDem:77,choDem:false},{ngay:lui(-1),giao:12,khoDem:0,choDem:true}],
      doiHen:[{cu:lui(-5),moi:lui(-3),lyDo:'Máy in hỏng một ngày'}],
      sx:Object.assign({},sx0,{ngayChot:lui(-25),veDau:lui(-2),chotDenCat:5,chotDenVeDau:23,daQua:25,xuong:'Xưởng B',vaiVe:lui(-23),thongTin:'In xong, đang may'})}),
    lo(2,'MA26002','L4',2,464,235,235,lui(5),{maTran:mt(['150','160','170'],[['Đen',[68,47,114]]]),lanVe:[{ngay:lui(-4),giao:235,khoDem:235,choDem:false}]}),
    lo(3,'MA26003','Tái 1',null,360,341,341,null,{theoMau:[{mau:'Ghi',conNo:19}],lanVe:[{ngay:lui(-9),giao:341,khoDem:341,choDem:false}]}),
    lo(4,'MA26004','L1',4,58,58,58,lui(-6),{choVe:false,maTran:mt(['140','150'],[['Đen',[0,0]]]),lanVe:[{ngay:lui(-6),giao:58,khoDem:58,choDem:false}]})
  ];
  const don=(id,ma,soPhieu,ngayDat,tongDat,trangThai,x)=>Object.assign({id,ma,soPhieu,soPdh:id!=null?'PĐH-2611'+String(10+id)+'-0'+id:null,ngayDat,duKienCat:null,ngayCat:null,tongDat,daCat:0,daGiao:0,khoDem:0,choCat:0,conNo:0,trangThai,nhan:'',chuaDoiSoat:false,maTran:null,theoMau:[],los:[]},x||{});
  const d={at:Date.now(),homNay:hn,ghiThongTin:true,tomTat:{},los,
    don:[
      don(1,'MA26001','L1',lui(-30),192,'dang_tra',{los:['L1'],maTran:mt(['130','140','150','160'],[['Đỏ',[20,24,44,64]],['Trắng',[8,16,12,4]]])}),
      don(2,'MA26002','L4',lui(-28),600,'dang_tra',{los:['L4'],choCat:136,theoMau:[{mau:'Đen',so:600}]}),
      don(null,'MA26003','Tái 1',null,null,'dang_tra',{los:['Tái 1']}),
      don(5,'MA26005','L2',lui(-6),500,'cho_cat',{choCat:500,duKienCat:lui(3),maTran:mt(['130','140','150'],[['Hồng',[100,150,100]],['Xanh',[50,50,50]]])}),
      don(4,'MA26004','L1',lui(-40),58,'xong',{los:['L1'],theoMau:[{mau:'Đen',so:58}]})
    ]};
  mockTinh(d);return d;
}
/* tính lại các số phụ thuộc của số giả (sau khi tạo và sau mỗi lần lưu thử) */
function mockTinh(d){
  for(const x of d.los){
    x.conNo=x.soCat-x.khoDem;x.choVe=x.trangThai==='dang_ve'&&x.conNo>0;
    x.conTra=x.soCat-x.daGiao;if(x.maTranTra===undefined)x.maTranTra=x.maTran;if(!x.theoMauTra)x.theoMauTra=(x.theoMau||[]).map(c=>({mau:c.mau,conTra:c.conNo}));
    const tre=x.choVe&&x.henTra?soNgay(x.henTra,d.homNay):0;x.ngayTre=Math.max(0,tre);
    x.nhan=x.conNo<=0?{k:'ok',t:'Đủ lô'}:!x.henTra?{k:'warn',t:'Chưa hẹn ngày'}:tre>0?{k:'late',t:'Trễ '+tre+' ngày'}:tre===0?{k:'warn',t:'Hẹn hôm nay'}:{k:'idle',t:'Còn '+(-tre)+' ngày'};
  }
  const nhan={cho_cat:'Chờ cắt',da_cat:'Đã cắt',dang_tra:'Đang trả',xong:'Xong'};
  for(const p of d.don){
    const ls=d.los.filter(x=>p.id==null?(x.phieuId==null&&x.ma===p.ma):x.phieuId===p.id);
    p.daCat=ls.reduce((a,x)=>a+x.soCat,0);p.daGiao=ls.reduce((a,x)=>a+x.daGiao,0);p.khoDem=ls.reduce((a,x)=>a+x.khoDem,0);
    p.conNo=ls.filter(x=>x.choVe).reduce((a,x)=>a+x.conNo,0);
    p.nhan=nhan[p.trangThai]+(p.trangThai==='dang_tra'&&p.choCat>0?' · cắt một phần':'');
  }
  const mo=d.los.filter(x=>x.choVe);
  d.tomTat={loTre:mo.filter(x=>x.ngayTre>0).length,conNo:mo.reduce((a,x)=>a+x.conNo,0),veHomNay:0,phieuHomNay:0,
    choCat:d.don.reduce((a,p)=>a+p.choCat,0),choKhoDem:d.los.reduce((a,x)=>a+x.choKhoDem,0),phieuChoCat:d.don.filter(p=>p.choCat>0).length,
    conTra:d.los.filter(x=>x.trangThai!=='dong').reduce((a,x)=>a+Math.max(0,x.conTra),0)};
}
let MOCK=null;
const MOCKP=[];
/* máy chủ giả cho nhập phiếu cắt, phiếu đóng gói và đọc ảnh */
function mockNhap(b){
  const tong=b.huy?0:b.dong.reduce((a,x)=>a+x.so,0),x=MOCK.los.find(l=>l.ma===b.ma_hang&&l.lo===b.lo);
  if(b.action==='giao_sua'){
    const lo=MOCK.los.find(l=>l.lanVe.some(v=>v.id===b.id)),v=lo&&lo.lanVe.find(q=>q.id===b.id);
    if(!v)return {status:404,body:{error:'Không còn phiếu đóng gói này trong sổ'}};
    if(!v.sua)return {status:409,body:{error:'Phiếu này kho Magickids đã đếm: không sửa được'}};
    lo.daGiao+=tong-v.giao;lo.choKhoDem+=tong-v.giao;
    if(b.huy)lo.lanVe=lo.lanVe.filter(q=>q.id!==b.id);else Object.assign(v,{ngay:b.ngay,giao:tong,soPhieu:b.so_phieu||'',dong:b.dong});
  }else if(b.action==='giao'){
    if(!x)return {status:400,body:{error:'Chưa có lô cắt '+b.ma_hang+' '+b.lo+'. Nhập phiếu cắt của lô này trước'}};
    x.lanVe.push({id:Date.now(),sua:true,soPhieu:b.so_phieu||'',dong:b.dong,ngay:b.ngay,giao:tong,khoDem:0,choDem:true});x.daGiao+=tong;x.choKhoDem+=tong;
  }else{
    if(x&&!b.ghi_de&&!b.cong_them)return {status:409,body:{error:'Lô '+b.ma_hang+' '+b.lo+' đã có số cắt',daCo:true}};
    if(x&&b.cong_them){x.soCat+=tong;const p=x.phieuId!=null?MOCK.don.find(q=>q.id===x.phieuId):null;if(p)p.choCat=Math.max(0,p.choCat-tong);}
    else if(x)x.soCat=tong;
    else{

/* ---------- gọi máy chủ ---------- */
async function goi(method,body,query){
  if(THU){
    await new Promise(r=>setTimeout(r,200));
    if(!MOCK)MOCK=mock();
    if(query==='phieu'||(body&&/^phieu_/.test(body.action||'')))return mockPhieu(method,body);
    if(body&&(body.action==='cat'||body.action==='giao'||body.action==='giao_sua'))return mockNhap(body);
    if(body&&body.action==='doc_anh'){await new Promise(r=>setTimeout(r,900));return mockDocAnh(body);}
    return method==='GET'?{status:200,body:JSON.parse(JSON.stringify(MOCK))}:mockGhi(body);
  }
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API+(query?'?'+query+'=1':''),{method,cache:'no-store',signal:ctl.signal,
      headers:Object.assign({'x-mk-key':S.key},body?{'content-type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
    let j=null;try{j=await r.json();}catch(e){}
    return {status:r.status,body:j||{}};
  }finally{clearTimeout(t);}
}
const loiMang=e=>e&&e.name==='AbortError'?'quá thời gian chờ':'không kết nối được máy chủ';

function hoiMa(msg){
  $('app').hidden=true;$('gate').hidden=false;$('gateMsg').textContent=msg||'';$('keyIn').value='';
  try{$('keyIn').focus();}catch(e){}
}
async function tai(){
  if(S.busy)return;

  $('gate').hidden=true;$('app').hidden=false;
  S.busy=true;S.err='';ve();
  try{
    const r=await goi('GET');
    if(r.status===401){S.key='';store.set('mk_xuong_key','');S.busy=false;hoiMa('Phiên đăng nhập đã hết hạn hoặc mật khẩu đã đổi. Đăng nhập lại.');return;}
    if(r.status!==200||!r.body||!Array.isArray(r.body.los)||!Array.isArray(r.body.don))throw new Error(r.body&&r.body.error||'máy chủ không trả sổ');

}

  const mau=['#0f7b4b','#b26a00','#3558a8','#8a3a8f','#c2570c'][[...ma].reduce((a,c)=>a+c.charCodeAt(0),0)%5];

async function taiAnh(){
  const d=S.data;if(!d)return;
  const ma=[...new Set(d.don.map(p=>p.ma).concat(d.los.map(x=>x.ma)))];
  if(THU){for(const m of ma)if(m!=='MA26003')S.anh[m]=anhThu(m);return;}
  if(!S.anhAt){try{const c=JSON.parse(store.get('mk_xuong_anh')||'null');if(c&&c.at&&c.anh){S.anh=c.anh;S.anhAt=c.at;}}catch(e){}}
  const thieu=ma.filter(m=>!(m in S.anh));
  if(!thieu.length&&Date.now()-S.anhAt<6*3600000)return;
  try{
    const r=await fetch(API+'?anh='+encodeURIComponent((Date.now()-S.anhAt<6*3600000?thieu:ma).join(',')),{cache:'no-store',headers:{'x-mk-key':S.key}});

    const j=await r.json();if(!j||!j.anh)return;

    for(const m of (Date.now()-S.anhAt<6*3600000?thieu:ma))if(j.anh[m]||!j.loi)S.anh[m]=j.anh[m]||'';

function nut(form,msg,nhan,lay,x,khoa,iTen,xong){
  const b=mk('button','primary',nhan);b.type='button';
  b.onclick=async()=>{
    msg.className='msg err';
    const ten=iTen.value.replace(/\s+/g,' ').trim();
    if(ten.length<2||ten.length>40){msg.textContent='Ghi tên người cập nhật ở đầu trang trước (2 đến 40 ký tự).';try{iTen.focus();}catch(e){}return;}
    S.ten=ten;store.set('mk_xuong_ten',ten);
    const v=lay();if(typeof v==='string'){msg.textContent=v;return;}
    const than=Object.assign({ma_hang:x.ma,lo:x.lo,nguoi:ten},v);
    b.disabled=true;msg.className='msg m';msg.textContent='Đang lưu…';
    try{
      const r=await goi('POST',than);
      if(r.status===401){S.key='';store.set('mk_xuong_key','');hoiMa('Phiên đăng nhập đã hết hạn hoặc mật khẩu đã đổi. Đăng nhập lại.');return;}
      if(r.status===501||r.body&&r.body.chuaBat){S.chuaBat=true;msg.className='msg err';msg.textContent=CHUA_BAT+'. Báo Magickids để bật; ngày hẹn trả vẫn đổi được.';b.disabled=false;return;}
      if(r.status!==200||!r.body||!r.body.ok){msg.className='msg err';msg.textContent='Chưa lưu được: '+(r.body&&r.body.error||'máy chủ báo lỗi '+r.status)+'.';b.disabled=false;return;}
      S.saved={khoa,txt:'Đã lưu lúc '+hhmm(Date.now())+': '+xong(than)+'. Số bên dưới là số máy chủ vừa trả về.'};S.open.add(khoa);
      await tai();
    }catch(e){msg.className='msg err';msg.textContent='Chưa lưu được ('+loiMang(e)+'). Thử lại.';b.disabled=false;}
  };
  form.append(b,msg);
}
function formHen(x,khoa,iTen){
  const f=mk('div','form');f.append(mk('h3','','Đổi ngày hẹn trả'));
  const [w1,iNgay]=o('Ngày hẹn trả mới','date','');iNgay.min=homNay();
  const [w2,iLyDo]=o('Lý do (bắt buộc)','textarea','',300);iLyDo.placeholder='Ví dụ: vải về trễ 3 ngày';
  f.append(w1,w2);
  nut(f,mk('div','msg'),'Lưu ngày hẹn',()=>{
    const ngay=iNgay.value,ly=iLyDo.value.trim();

    if(ngay<homNay())return 'Ngày hẹn trả mới không được ở quá khứ.';
    if(ngay===x.henTra)return 'Ngày mới trùng ngày hẹn hiện tại.';

}
function formTin(x,khoa,iTen){
  const f=mk('div','form'),sx=x.sx||{};f.append(mk('h3','','Ghi thông tin sản xuất'));
  if(S.chuaBat){f.append(mk('div','note',CHUA_BAT+'.'));return f;}
  const [w1,iChot]=o('Ngày chốt sản xuất','date',sx.ngayChot||'');iChot.max=homNay();
  const [w2,iVai]=o('Ngày vải về','date',sx.vaiVe||'');iVai.max=homNay();
  const r=mk('div','row2');r.append(w1,w2);
  const [w3,iXuong]=o('Đơn vị gia công','text',sx.xuong||'',100);

  f.append(r,w3,w4,mk('div','m','Ô để trống thì giữ nguyên số đã ghi. Không ghi giá hay số tiền ở đây: câu có số tiền sẽ không hiện lại.'));
  nut(f,mk('div','msg'),'Lưu thông tin',()=>{
    const v={action:'thongtin'},hn=homNay();

    if((v.ngay_chot&&v.ngay_chot>hn)||(v.ngay_vai_ve&&v.ngay_vai_ve>hn))return 'Ngày chốt và ngày vải về không được ở tương lai.';

    return v;
  },x,khoa,iTen,b=>[b.ngay_chot?'chốt '+day(b.ngay_chot,true):'',b.ngay_vai_ve?'vải về '+day(b.ngay_vai_ve,true):'',b.xuong?'gia công '+b.xuong:'',b.thong_tin_sx?'tiến độ':''].filter(Boolean).join(', '));
  return f;
}

/* ---------- làm phiếu gửi đối tác: đặt vải, đặt in thêu, giao may ----------
   Phiếu lưu trên máy này (localStorage) và trên máy chủ để máy khác của xưởng mở lại được.
   In ra giấy hoặc lưu PDF bằng lệnh in của trình duyệt. */
const LOAI={
  vai:{ten:'Phiếu đặt vải',tieuDe:'PHIẾU ĐẶT VẢI',dau:'DV',gui:'Nhà cung cấp vải',can:'Ngày cần vải về'},
  in:{ten:'Phiếu đặt in, thêu',tieuDe:'PHIẾU ĐẶT IN, THÊU',dau:'IN',gui:'Xưởng in, thêu',can:'Ngày cần nhận lại'},
  may:{ten:'Phiếu giao may',tieuDe:'PHIẾU GIAO HÀNG CẮT - ĐẶT MAY',dau:'GM',gui:'Tổ may, xưởng may',can:'Ngày cần trả hàng'}
};
const docJson=(k,macDinh)=>{try{const v=JSON.parse(store.get(k)||'null');return v==null?macDinh:v;}catch(e){return macDinh;}};
const PH={gui:docJson('mk_xuong_ben_gui',{ten:'',diaChi:'',sdt:'',nguoi:''}),ds:docJson('mk_xuong_phieu',[]),p:null,xem:false,
  srv:null,srvAt:0,srvBusy:false,srvErr:'',chuaBat:false,luu:null};
const soPhieuMoi=loai=>{
  const hn=homNay(),goc=LOAI[loai].dau+'-'+hn.slice(2,4)+hn.slice(5,7)+hn.slice(8,10)+'-';
  const n=PH.ds.concat(PH.srv||[]).filter(x=>String(x.so||'').startsWith(goc)).map(x=>Number(String(x.so).slice(goc.length))||0);
  return goc+String(Math.max(0,...n)+1).padStart(2,'0');
};
const phieuMoi=loai=>({id:'p'+Date.now(),loai,so:soPhieuMoi(loai),ngay:homNay(),can:'',doiTac:'',lienHe:'',ma:'',lo:'',
  vai:[{ten:'',mau:'',sl:'',dv:'kg',gia:'',ghi:''}],sizes:['130','140','150','160','170','180'],hang:[{mau:'',o:[]}],
  viTri:'',kieu:'',yeuCau:'',ghiChu:''});
const soNhap=v=>{const n=Number(String(v==null?'':v).replace(/[.\s]/g,'').replace(',','.'));return isFinite(n)&&n>0?n:0;};
const tongHang=h=>PH.p.sizes.reduce((a,_,i)=>a+soNhap(h.o[i]),0);
function luuPhieu(){
  const p=JSON.parse(JSON.stringify(PH.p));p.luuLuc=Date.now();
  PH.ds=[p].concat(PH.ds.filter(x=>x.id!==p.id)).slice(0,40);
  store.set('mk_xuong_phieu',JSON.stringify(PH.ds));store.set('mk_xuong_ben_gui',JSON.stringify(PH.gui));
}
/* danh sách phiếu trên máy chủ: máy nào của xưởng cũng thấy */
async function taiPhieu(buoc){
  if(PH.srvBusy||(!buoc&&PH.srv&&Date.now()-PH.srvAt<120000))return;
  if(!THU&&!S.key)return;
  PH.srvBusy=true;PH.srvErr='';
  try{
    const r=await goi('GET',null,'phieu');
    if(r.status===401){S.key='';store.set('mk_xuong_key','');PH.srvBusy=false;hoiMa('Phiên đăng nhập đã hết hạn hoặc mật khẩu đã đổi. Đăng nhập lại.');return;}
    if(r.status!==200||!r.body||!Array.isArray(r.body.phieu))throw new Error(r.body&&r.body.error||'máy chủ không trả danh sách phiếu');
    PH.srv=r.body.phieu;PH.srvAt=Date.now();PH.chuaBat=!!r.body.chuaBat;
  }catch(e){PH.srvErr='Chưa đọc được phiếu trên máy chủ ('+(e.message&&e.name!=='AbortError'&&e.name!=='TypeError'?e.message:loiMang(e))+').';}
  PH.srvBusy=false;if(S.tab==='phieu'&&!PH.xem)veDsPhieu();
}
/* đưa phiếu đang mở lên máy chủ (kể cả đơn giá vải); lỗi thì phiếu vẫn nằm trên máy này */
async function dayPhieu(){
  const p=PH.p;PH.luu={k:'m',t:'Đang lưu lên máy chủ…'};veLuu();
  const sach=JSON.parse(JSON.stringify(p));for(const k of ['id','sid','luuLuc','doc'])delete sach[k];
  sach.gui=PH.gui;
  try{
    const r=await goi('POST',{action:'phieu_luu',id:p.sid||undefined,nguoi:S.ten||undefined,phieu:sach});
    if(r.status===401){S.key='';store.set('mk_xuong_key','');hoiMa('Phiên đăng nhập đã hết hạn hoặc mật khẩu đã đổi. Đăng nhập lại.');return;}
    if(r.status===501||r.body&&r.body.chuaBat){PH.chuaBat=true;PH.luu={k:'amber',t:'Máy chủ chưa bật phần lưu phiếu: phiếu đang nằm trên máy này. In và gửi vẫn được.'};}
    else if(r.status===404&&p.sid){delete p.sid;luuPhieu();PH.luu={k:'err',t:'Phiếu này đã bị xóa trên máy chủ. Bấm "Sửa phiếu" rồi "Xem phiếu" lần nữa để lưu thành phiếu mới.'};}
    else if(r.status!==200||!r.body||!r.body.ok)PH.luu={k:'err',t:'Chưa lưu lên máy chủ được: '+(r.body&&r.body.error||'máy chủ báo lỗi '+r.status)+'. Phiếu vẫn nằm trên máy này.'};
    else{
      const doiSo=r.body.so&&r.body.so!==p.so;
      if(doiSo)p.so=r.body.so;
      p.sid=r.body.id;luuPhieu();PH.srvAt=0;
      PH.luu={k:'ok',t:'Đã lưu lên máy chủ lúc '+hhmm(Date.now())+(doiSo?'. Số phiếu đổi thành '+p.so+' vì số cũ máy khác đã dùng':'')+'.'};
      if(doiSo&&PH.xem){ve();return;}
    }
  }catch(e){PH.luu={k:'err',t:'Chưa lưu lên máy chủ được ('+loiMang(e)+'). Phiếu vẫn nằm trên máy này.'};}
  veLuu();
}
function veLuu(){const x=$('phLuu');if(x&&PH.luu){x.className='msg '+(PH.luu.k==='m'?'m':PH.luu.k);x.textContent=PH.luu.t;}}
/* lấy mã, lô và số màu × size từ sổ: lô đang làm (số đặt của phiếu nối với lô) hoặc phiếu chờ cắt */
function nguonSo(d){
  const ds=[];if(!d)return ds;
  for(const p of d.don){
    if(p.trangThai==='xong')continue;
    const lo=p.los&&p.los.length?p.los.join(', '):(p.id!=null?p.soPhieu:'');
    ds.push({nhan:p.ma+(lo?' · '+lo:'')+(p.choCat>0&&!(p.los&&p.los.length)?' (chờ cắt)':''),ma:p.ma,lo,mt:p.maTran,theoMau:p.theoMau||[]});
  }
  return ds;
}
function layTuSo(n){
  const p=PH.p;p.ma=n.ma;p.lo=n.lo;
  if(n.mt){p.sizes=n.mt.sizes.slice();p.hang=n.mt.hang.map(h=>({mau:h.mau,o:h.o.map(x=>x?String(x):'')}));}
  else if(n.theoMau.length)p.hang=n.theoMau.map(c=>({mau:c.mau,o:[]}));
  if(p.loai==='vai'&&n.theoMau.length+((n.mt&&n.mt.hang.length)||0)>0&&p.vai.length===1&&!p.vai[0].ten&&!p.vai[0].mau)
    p.vai=(n.mt?n.mt.hang.map(h=>h.mau):n.theoMau.map(c=>c.mau)).map(m=>({ten:'',mau:m,sl:'',dv:'kg',gia:'',ghi:''}));
}

  d1.append(truong(PH.gui,'ten','Tên đơn vị (in ở đầu phiếu)','text',80,'Ví dụ: Xưởng may A'),truong(PH.gui,'diaChi','Địa chỉ','text',160));
  const r1=mk('div','row2');r1.append(truong(PH.gui,'sdt','Điện thoại','tel',30),truong(PH.gui,'nguoi','Người lập phiếu','text',60));d1.append(r1);
  c1.append(s1,d1);body.append(c1);
  /* thông tin phiếu */
  const c2=mk('div','card'),d2=mk('div','d');

  d2.append(r4,truong(p,'can',L.can,'date'));
  c2.append(d2);body.append(c2);
  /* nội dung */
  const c3=mk('div','card'),d3=mk('div','d');
  if(p.loai==='vai'){
    d3.append(mk('b','','Vải cần đặt'));
    const [nutAnh,tbAnh]=nutDocAnh('vai',kq=>{

function moPhieu(x){
  PH.p=JSON.parse(JSON.stringify(x));const p=PH.p;
  if(!p.id)p.id='p'+Date.now();
  if(!Array.isArray(p.vai)||!p.vai.length)p.vai=[{ten:'',mau:'',sl:'',dv:'kg',gia:'',ghi:''}];
  p.vai.forEach(v=>{if(v.gia==null)v.gia='';});
  if(!Array.isArray(p.sizes)||!p.sizes.length)p.sizes=['130','140','150','160','170','180'];
  if(!Array.isArray(p.hang)||!p.hang.length)p.hang=[{mau:'',o:[]}];
  for(const k of ['can','lienHe','ma','lo','viTri','kieu','yeuCau','ghiChu'])if(p[k]==null)p[k]='';
  if(p.gui&&!PH.gui.ten)PH.gui=Object.assign({ten:'',diaChi:'',sdt:'',nguoi:''},p.gui);
  delete p.gui;PH.luu=null;PH.xem=false;ve();scrollTo(0,0);
}
function veDsPhieu(){
  const hop=$('phDs');if(!hop)return;hop.textContent='';
  const the1=(x,ghiThem,xoa)=>{
    const c=mk('div','card'),dd=mk('div','d'),top=mk('div','top');
    top.append(mk('span','code',x.so),mk('span','m',day(x.ngay,true)));
    const mo=mk('button','','Mở lại');mo.type='button';mo.onclick=()=>moPhieu(x);
    const bx=mk('button','','Xóa');bx.type='button';bx.onclick=xoa;
    const hn=mk('div','loc');hn.append(mo,bx);
    dd.append(top,mk('div','m',LOAI[x.loai].ten+' · '+(x.doiTac||'')+(x.ma?' · '+x.ma+(x.lo?' '+x.lo:''):'')+(ghiThem?' · '+ghiThem:'')),hn);c.append(dd);hop.append(c);
  };
  const srv=PH.srv||[];
  if(PH.chuaBat)hop.append(mk('div','note','Máy chủ chưa bật phần lưu phiếu: phiếu đang lưu trên máy này, máy khác chưa thấy.'));
  else{
    hop.append(mk('div','sec','Phiếu đã lưu trên máy chủ ('+srv.length+')'));
    if(PH.srvErr)hop.append(mk('div','msg err',PH.srvErr));
    else if(!PH.srv)hop.append(mk('div','m','Đang đọc danh sách phiếu…'));
    else if(!srv.length)hop.append(mk('div','m','Chưa có phiếu nào trên máy chủ.'));
    for(const r of srv){
      const x=Object.assign({},r.phieu,{sid:r.id,so:r.so});
      the1(x,(r.nguoi?'người lưu: '+r.nguoi+' · ':'')+'sửa '+day(String(r.suaLuc).slice(0,10)),async()=>{
        if(!confirm('Xóa phiếu '+r.so+' trên máy chủ? Máy khác cũng không thấy phiếu này nữa.'))return;
        try{
          const k=await goi('POST',{action:'phieu_xoa',id:r.id,nguoi:S.ten||undefined});
          if(k.status!==200||!k.body.ok){alert('Chưa xóa được: '+(k.body&&k.body.error||'máy chủ báo lỗi '+k.status));return;}
        }catch(e){alert('Chưa xóa được ('+loiMang(e)+').');return;}
        PH.ds=PH.ds.filter(y=>y.sid!==r.id);store.set('mk_xuong_phieu',JSON.stringify(PH.ds));
        if(PH.p&&PH.p.sid===r.id)delete PH.p.sid;
        PH.srv=srv.filter(y=>y.id!==r.id);veDsPhieu();
      });
    }
  }
  /* phiếu chỉ có trên máy này: chưa lên được máy chủ (mất mạng, máy chủ chưa bật), hoặc đã bị xóa trên máy chủ */
  const coTren=new Set(srv.map(r=>r.id));
  const rieng=PH.ds.filter(x=>PH.chuaBat||!PH.srv||!x.sid||!coTren.has(x.sid));
  if(rieng.length&&(PH.chuaBat||PH.srv||PH.srvErr)){
    hop.append(mk('div','sec','Phiếu chỉ có trên máy này ('+rieng.length+')'));
    for(const x of rieng)the1(x,PH.chuaBat?'':'mở lại rồi bấm "Xem phiếu" để lưu lên máy chủ',()=>{
      if(!confirm('Xóa phiếu '+x.so+' khỏi máy này?'))return;
      PH.ds=PH.ds.filter(y=>y.id!==x.id);store.set('mk_xuong_phieu',JSON.stringify(PH.ds));veDsPhieu();
    });
  }
}

/* ---------- chọn mã rồi chọn lô (tên lô như xưởng gọi, kèm số PĐH); phần mềm tự nối với phiếu đặt ---------- */
const tenPhieu=p=>nhanDon(p)+(p.soPdh?' ('+p.soPdh+')':'');
/* lô nội bộ của một phiếu khi cắt: lô đã nối với phiếu thì cộng vào lô đó, chưa có thì đặt tên theo đợt của phiếu */
function loNoiBo(d,p){
  const ls=d.los.filter(x=>x.phieuId===p.id);
  if(ls.length===1)return ls[0].lo;
  return p.soPhieu||p.soPdh||('Đặt '+day(p.ngayDat));
}
function chonPhieu(d,p,khung){
  /* danh sách lựa chọn: phiếu cắt → phiếu chưa xong; phiếu đóng gói → từng lô còn phải trả (theo phiếu nếu có) */
  const ds=[];
  if(p.loai==='cat'){
    for(const q of d.don)if(q.id!=null&&q.trangThai!=='xong'&&(q.choCat>0||q.daCat===0))ds.push({ma:q.ma,nhan:tenPhieu(q)+' · đặt '+num(q.tongDat)+' · đã cắt '+num(q.daCat),q,lo:loNoiBo(d,q)});
  }else{
    for(const x of d.los){
      const ct=x.conTra!=null?x.conTra:x.conNo;
      if(x.trangThai==='dong'||ct<=0)continue;
      const q=x.phieuId!=null?d.don.find(z=>z.id===x.phieuId):null;
            ds.push({ma:x.ma,nhan:x.lo+(q&&q.soPdh?' ('+q.soPdh+')':'')+' · còn phải trả '+num(ct),q,lo:x.lo,x});
    }
  }
  const mas=[...new Set(ds.map(n=>n.ma))].sort();
  if(!p.ma&&mas.length===1)p.ma=mas[0];
  const lMa=mk('label','','Mã hàng'),sMa=mk('select');
  sMa.append(new Option('— chọn mã —',''));for(const m of mas)sMa.append(new Option(m,m));sMa.value=mas.includes(p.ma)?p.ma:'';
  sMa.onchange=()=>{const t=p.loai;NP.p=nhapMoi(t);NP.p.ma=sMa.value;NP.msg=null;ve();};
  const w1=mk('div');w1.append(lMa,sMa);
  const cua=ds.filter(n=>n.ma===p.ma);
  const lP=mk('label','','Lô'),sP=mk('select');
  sP.append(new Option(p.ma?'— chọn lô —':'chọn mã trước',''));cua.forEach((n,i)=>sP.append(new Option(n.nhan,String(i))));
  const dangChon=cua.findIndex(n=>(n.q?n.q.id:null)===(p.phieuId!=null?p.phieuId:-1)&&n.lo===p.lo);
  sP.value=dangChon>=0?String(dangChon):'';sP.disabled=!p.ma;
  const chon=n=>{
    const goc={ma:n.ma,lo:n.lo,dot:n.q?n.q.soPhieu:'',mt:p.loai==='cat'?(n.q&&n.q.maTran):(n.x.maTranTra!==undefined?n.x.maTranTra:n.x.maTran),
      mau:p.loai==='cat'?((n.q&&n.q.theoMau)||[]).map(c=>c.mau):(n.x.theoMauTra||n.x.theoMau||[]).map(c=>c.mau),goi:p.loai==='cat'?'đặt':'còn phải trả'};
    layNguonNhap(goc);NP.p.phieuId=n.q?n.q.id:null;
  };
  sP.onchange=()=>{if(sP.value==='')return;chon(cua[Number(sP.value)]);NP.msg=null;ve();};
  if(p.ma&&cua.length===1&&dangChon<0){chon(cua[0]);ve();return;}
  const w2=mk('div');w2.append(lP,sP);
  const r=mk('div','row2');r.append(w1,w2);khung.append(r);
  if(dangChon>=0){
    const daCo=p.loai==='cat'&&d.los.some(x=>x.ma===p.ma&&x.lo===p.lo);
    khung.append(mk('div','m','Ghi vào lô "'+p.lo+'"'+(daCo?'; lô này đã cắt trước đó nên số lần này được cộng thêm vào.':'.')));
  }
  const bTay=mk('button','','Không có trong danh sách: nhập tay mã, lô');bTay.type='button';
  bTay.onclick=()=>{const t=p.loai;NP.p=nhapMoi(t);NP.p.tay=true;ve();};
  const w3=mk('div');w3.append(bTay);khung.append(w3);
}

/* ---------- nút nhập phiếu ngay trong thẻ đơn: mở màn Nhập phiếu / Làm phiếu đã điền sẵn mã, lô, màu, size ---------- */
function moNhap(d,loai,ma,lo,dot,don){
  NP.p=nhapMoi(loai);NP.msg=null;
  const pd=don&&don.id!=null?don:d.don.find(q=>q.id!=null&&q.ma===ma&&(loai==='cat'?q.soPhieu===(dot||''):q.los.includes(lo)));
  const n=nguonNhap(d,loai).find(x=>x.ma===ma&&(loai==='cat'?x.dot===(dot||''):x.lo===lo));
  if(n)layNguonNhap(n);
  else if(don)layNguonNhap({ma,lo:lo||dot||'',dot:dot||'',mt:don.maTran,mau:(don.theoMau||[]).map(c=>c.mau),goi:'đặt'});

/* ---------- nhập phiếu cắt và phiếu đóng gói: số vào Sổ hàng xưởng ngay ----------
   Phiếu cắt     → lô cắt với số cắt màu × size.
   Phiếu đóng gói → một lần giao: số XƯỞNG GIAO; kho Magickids đếm xong mới tính là đã trả.
   Có thể chụp ảnh phiếu giấy để máy đọc ra bảng; người nhập soát lại rồi mới lưu. */
const NHAN_NHAP={cat:{ten:'Phiếu cắt',ngay:'Ngày cắt',so:'Số cắt'},giao:{ten:'Phiếu đóng gói',ngay:'Ngày giao',so:'Số đóng gói, giao'}};
const nhapMoi=loai=>({loai,ma:'',lo:'',ngay:homNay(),hen:'',dot:'',soPhieu:'',sizes:['130','140','150','160','170','180'],hang:[{mau:'',o:[]}],goiY:{},daCo:false,doc:''});
const NP={p:nhapMoi('cat'),msg:null,busy:false,docBusy:false};
const soO=v=>{const n=Number(String(v==null?'':v).replace(/[.\s]/g,''));return /^\d{1,7}$/.test(String(v==null?'':v).replace(/[.\s]/g,''))&&n>0?n:0;};
const tongDong=(p,h)=>p.sizes.reduce((a,_,i)=>a+soO(h.o[i]),0);
/* điền sẵn từ sổ: phiếu chờ cắt (màu, size, số đặt làm gợi ý) hoặc lô đang trả (còn nợ làm gợi ý) */
function nguonNhap(d,loai){
  const ds=[];if(!d)return ds;
  if(loai==='cat'){
    for(const p of d.don)if(p.id!=null&&p.choCat>0)ds.push({nhan:p.ma+(p.soPhieu?' · đợt '+p.soPhieu:'')+' · chờ cắt '+num(p.choCat),ma:p.ma,lo:p.soPhieu||'',dot:p.soPhieu||'',mt:p.maTran,mau:(p.theoMau||[]).map(c=>c.mau),goi:'đặt'});
  }else{
    for(const x of d.los)if(x.trangThai!=='dong'&&(x.choVe||x.trangThai==='chua_doi_soat'))ds.push({nhan:x.ma+' · '+x.lo+(x.trangThai==='chua_doi_soat'?'':' · còn nợ '+num(Math.max(0,x.conNo))),ma:x.ma,lo:x.lo,dot:'',mt:x.maTran,mau:(x.theoMau||[]).map(c=>c.mau),goi:'còn nợ'});
  }
  return ds;
}
function layNguonNhap(n){
  const p=NP.p;p.ma=n.ma;p.lo=n.lo;p.dot=n.dot;p.goiY={};p.daCo=false;p.doc='';
  if(n.mt){p.sizes=n.mt.sizes.slice();p.hang=n.mt.hang.map(h=>({mau:h.mau,o:[]}));n.mt.hang.forEach(h=>h.o.forEach((v,i)=>{if(v)p.goiY[h.mau+'|'+i]=n.goi+' '+v;}));}
  else if(n.mau.length)p.hang=n.mau.map(m=>({mau:m,o:[]}));

/* mở lại một phiếu đóng gói do xưởng nhập (kho chưa đếm) để sửa số hoặc hủy */
function suaPhieuGiao(x,v){
  const cmp=(a,b)=>{const na=Number(a),nb=Number(b);return (isFinite(na)&&isFinite(nb)&&na!==nb)?na-nb:String(a).localeCompare(String(b),'vi');};
  const sizes=[...new Set((v.dong||[]).map(d=>d.size))].sort(cmp),mau=[...new Set((v.dong||[]).map(d=>d.mau))];
  const p=nhapMoi('giao');
  Object.assign(p,{suaId:v.id,ma:x.ma,lo:x.lo,ngay:v.ngay,soPhieu:v.soPhieu||'',goc:(v.dong||[]).map(d=>({mau:d.mau,size:d.size,so:0})),
    sizes:sizes.length?sizes:p.sizes,hang:mau.length?mau.map(m=>({mau:m,o:sizes.map(sz=>{const d=v.dong.find(q=>q.mau===m&&q.size===sz);return d&&d.so?String(d.so):'';})})):p.hang});
  NP.p=p;NP.msg=null;S.tab='nhap';ve();scrollTo(0,0);
}
/* thu nhỏ ảnh trên máy trước khi gửi: cạnh dài tối đa 1800px, JPEG */
function thuNhoAnh(file){
  return new Promise((ok,loi)=>{
    const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const k=Math.min(1,1800/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
      ok(c.toDataURL('image/jpeg',0.85));
    };
    im.onerror=()=>{URL.revokeObjectURL(u);loi(new Error('không mở được ảnh'));};
    im.src=u;
  });
}
/* nút "Đọc từ ảnh": chọn hoặc chụp ảnh → máy chủ đọc ra bảng → gọi nhan(kq). Trả [nút, dòng báo]. */
function nutDocAnh(loai,nhan){
  const w=mk('div','loc'),inp=document.createElement('input'),b=mk('button','',DI_DONG?'Chọn ảnh phiếu có sẵn':'Đọc từ ảnh chụp phiếu'),tb=mk('div','msg m');
  inp.type='file';inp.accept='image/*';inp.hidden=true;b.type='button';b.disabled=NP.docBusy;
  b.onclick=()=>{inp.removeAttribute('capture');inp.click();};
  /* điện thoại: nút mở thẳng camera sau để chụp phiếu */
  const bChup=mk('button','primary','Chụp ảnh phiếu');bChup.type='button';bChup.disabled=NP.docBusy;
  bChup.onclick=()=>{inp.setAttribute('capture','environment');inp.click();};
  if(DI_DONG)w.append(bChup);
  inp.onchange=async()=>{
    const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
    NP.docBusy=true;b.disabled=true;bChup.disabled=true;tb.className='msg m';tb.textContent='Đang đọc ảnh, chờ khoảng nửa phút…';
    try{
      const anh=await thuNhoAnh(f);
      const r=await goi('POST',{action:'doc_anh',loai,anh});
      if(r.status===401){S.key='';store.set('mk_xuong_key','');hoiMa('Phiên đăng nhập đã hết hạn hoặc mật khẩu đã đổi. Đăng nhập lại.');return;}
      if(r.status!==200||!r.body||!r.body.ok){tb.className='msg err';tb.textContent=(r.body&&r.body.chuaBat?'Máy chủ chưa bật phần đọc ảnh: báo Magickids để bật. ':'')+'Chưa đọc được ảnh'+(r.body&&r.body.error&&!r.body.chuaBat?': '+r.body.error:'')+'. Nhập tay vẫn được.';return;}
      NP.docBusy=false;nhan(r.body);
    }catch(e){tb.className='msg err';tb.textContent='Chưa đọc được ảnh ('+(e.message&&e.name!=='AbortError'&&e.name!=='TypeError'?e.message:loiMang(e))+'). Nhập tay vẫn được.';}
    finally{NP.docBusy=false;b.disabled=false;bChup.disabled=false;}

      const ten=iTen.value.replace(/\s+/g,' ').trim();msg.className='msg err';
      if(ten.length<2||ten.length>40){msg.textContent='Ghi tên người nhập trước (2 đến 40 ký tự).';return;}
      if(!confirm('HỦY phiếu đóng gói ngày '+day(p.ngay,true)+' của lô '+p.ma+' '+p.lo+'?\nSố đã giao của phiếu này về 0 và phiếu không hiện nữa.'))return;
      bHuy.disabled=true;msg.className='msg m';msg.textContent='Đang hủy…';
      try{
        const r=await goi('POST',{action:'giao_sua',id:p.suaId,huy:true,ngay:p.ngay,dong:p.goc,nguoi:ten});
        if(r.status!==200||!r.body||!r.body.ok){msg.className='msg err';msg.textContent='Chưa hủy được: '+(r.body&&r.body.error||'máy chủ báo lỗi '+r.status)+'.';bHuy.disabled=false;return;}
        NP.msg={k:'ok',t:'Đã hủy phiếu đóng gói ngày '+day(p.ngay,true)+' của lô '+p.ma+' '+p.lo+'.'};NP.p=nhapMoi('giao');await tai();scrollTo(0,0);
      }catch(e){msg.className='msg err';msg.textContent='Chưa hủy được ('+loiMang(e)+'). Thử lại.';bHuy.disabled=false;}
    };
    hang.append(bHuy);
  }
  if(p.loai==='cat'&&p.daCo){
    bLuu.remove();
    const bCong=mk('button','primary','Cộng thêm vào lô');bCong.type='button';bCong.onclick=()=>luu('cong',bCong);
    const bDe=mk('button','','Thay số cắt cũ');bDe.type='button';bDe.onclick=()=>luu('de',bDe);hang.prepend(bCong);hang.append(bDe);
  }
  const bXoa=mk('button','','Xóa trắng');bXoa.type='button';bXoa.onclick=()=>{NP.p=nhapMoi(p.loai);NP.msg=null;ve();};hang.append(bXoa);
  body.append(hang,msg);
}

/* ---------- điện thoại: gợi ý cài trang lên màn hình chính để mở như một app ---------- */
(function(){
  const daCai=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  if(!DI_DONG||daCai||store.get('mk_xuong_an_cai'))return;
  const hop=$('caiApp'),txt=$('caiTxt'),nut=$('caiNut');let su=null;
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  txt.textContent=ios?'Để mở nhanh như app: bấm nút Chia sẻ của Safari rồi chọn "Thêm vào MH chính".':'Để mở nhanh như app: bấm ⋮ của trình duyệt rồi chọn "Thêm vào màn hình chính".';
  hop.hidden=false;
  addEventListener('beforeinstallprompt',e=>{e.preventDefault();su=e;txt.textContent='Cài trang này lên màn hình chính để mở nhanh như app.';nut.hidden=false;});
  nut.onclick=async()=>{if(!su)return;su.prompt();try{await su.userChoice;}catch(e){}su=null;hop.hidden=true;};
  addEventListener('appinstalled',()=>{hop.hidden=true;});
  $('caiDong').onclick=()=>{hop.hidden=true;store.set('mk_xuong_an_cai','1');};
})();

/* ---------- nút ---------- */
for(const b of $('tabs').children)b.onclick=()=>{S.tab=b.dataset.t;S.saved=null;PH.xem=false;ve();};
$('btnReload').onclick=()=>{S.saved=null;tai();};
$('btnKey').onclick=()=>{if(THU)return;S.key='';store.set('mk_xuong_key','');S.data=null;hoiMa('');};
$('keyOk').onclick=async()=>{
  const k=$('keyIn').value.trim(),nut=$('keyOk'),tb=$('gateMsg');
  if(!k){tb.textContent='Chưa nhập mật khẩu.';return;}
  nut.disabled=true;tb.className='msg m';tb.textContent='Đang đăng nhập…';
  try{
    const r=await fetch(API+'/dang-nhap',{method:'POST',cache:'no-store',headers:{'content-type':'application/json'},body:JSON.stringify({mat_khau:k})});
    const b=await r.json().catch(()=>null);
    tb.className='msg err';
    if(r.status===401){tb.textContent='Mật khẩu không đúng.';return;}
    if(r.status!==200||!b||!b.ok||!b.ve){tb.textContent='Chưa đăng nhập được: '+(b&&b.error||'máy chủ báo lỗi '+r.status)+'.';return;}
    tb.textContent='';S.key=b.ve;store.set('mk_xuong_key',b.ve);tai();
  }catch(e){tb.className='msg err';tb.textContent='Chưa đăng nhập được ('+loiMang(e)+'). Thử lại.';}
  finally{nut.disabled=false;}
};
$('keyIn').onkeydown=e=>{if(e.key==='Enter')$('keyOk').click();};
if(THU){$('thuBar').hidden=false;$('btnKey').hidden=true;}
tai();
</script>
