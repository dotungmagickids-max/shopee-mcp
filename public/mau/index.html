<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#14171c;--mut:#5b6472;--line:#d9dde3;--accent:#6d3fc4;--red:#c62828;--amber:#b26a00;--green:#0f7b4b}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Segoe UI",Arial,sans-serif}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:10px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.danger{border-color:var(--red);color:var(--red)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
header{background:var(--accent);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap}
header button{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff;padding:7px 12px}

.info{color:var(--mut);font-size:14px;margin:0 0 10px}

.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input{flex:1;min-width:160px}
.bar select{width:auto}
.loc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.loc button{padding:6px 12px;font-size:14px;border-radius:999px}
.loc button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.the{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column}

.hinh{aspect-ratio:1/1;background:#e9ebf0;display:flex;align-items:center;justify-content:center;color:#9aa1ad;font-size:13px;overflow:hidden}

.rong{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--mut)}
.hop{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}

.nut{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.lk{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:9px 13px;background:#fff;color:var(--accent);font-weight:600;text-decoration:none}
a.lk.chinh{background:var(--accent);border-color:var(--accent);color:#fff}

<script>
'use strict';
/* Trang Mẫu và media, đợt 1: danh sách mẫu, hồ sơ từng mẫu, chọn / bỏ / đã có media.
   Chỉ gọi /api/mau. Ảnh, video nằm ở kho lưu trữ bên ngoài, trang chỉ mở đường dẫn.
   Thêm ?thu=1 để chạy thử bằng dữ liệu giả; thêm &vai=lam hoặc &vai=xem để thử vai khác. */
const Q=new URLSearchParams(location.search);
const THU=Q.has('thu');
const API='/api/mau';
const $=id=>document.getElementById(id);
const mk=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!=null)x.textContent=txt;return x;};
const store={
  get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},
  set(k,v){try{if(v)localStorage.setItem(k,v);else localStorage.removeItem(k);}catch(e){}}
};
const S={key:store.get('mk_mau_key'),ten:store.get('mk_mau_ten'),vai:'',ds:[],at:0,busy:false,err:'',
  loc:'tat',gioi:'',loai:'',tim:'',mo:null,them:false,nk:null,anh:new Map(),chiaSe:''};

const TT={dang_xem:'Đang xem',chon_lam:'Chọn làm',co_media:'Đã có media',bo:'Bỏ'};
const CHUYEN={dang_xem:['chon_lam','bo'],chon_lam:['co_media','dang_xem','bo'],co_media:['chon_lam','bo'],bo:['dang_xem']};
const NUT={chon_lam:'Chọn làm',co_media:'Duyệt: đã có media',dang_xem:'Đưa về Đang xem',bo:'Bỏ mẫu'};
const SUA={chua_giao:'Chưa giao',dang_lam:'Đang làm',cho_duyet:'Chờ duyệt',da_duyet:'Đã duyệt'};
const NGUON={taobao:'Link Taobao / Tmall',suu_tam:'Ảnh sưu tầm',xuong:'Mẫu xưởng gửi',tu_thiet_ke:'Tự thiết kế',ma_cu:'Mã cũ làm lại'};
const GIOI={'':'Chưa rõ',trai:'Bé trai',gai:'Bé gái',unisex:'Unisex'};
const LOAI={'':'Chưa chọn','Áo':'Áo','Quần':'Quần','Bộ':'Bộ','Váy':'Váy','Khác':'Khác'};
const hhmm=t=>{const d=new Date(t);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const ngayGio=iso=>{const d=new Date(iso);return isNaN(d)?'':String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+' '+hhmm(d);};
const laLink=v=>typeof v==='string'&&/^https:\/\/[^\s<>"'`]+$/.test(v);
/* Lấy đường dẫn đầu tiên trong đoạn dán (đoạn chia sẻ từ app mua hàng thường kèm chữ và mã). */
function tachLink(doan){
  const m=/https?:\/\/[^\s<>"'`，。、！】」）]+/i.exec(String(doan||''));
  if(!m)return '';
  return gonLink(m[0].replace(/^http:/i,'https:').replace(/[.,;:!?)\]]+$/,''));
}
/* Link trang sản phẩm Taobao / Tmall hay kèm rất nhiều tham số theo dõi: chỉ giữ id và skuId. */
function gonLink(link){
  try{
    const u=new URL(link);
    if(/(^|\.)(taobao|tmall)\.com$/.test(u.hostname)&&/^\d+$/.test(u.searchParams.get('id')||'')){
      const sku=u.searchParams.get('skuId');
      return u.origin+u.pathname+'?id='+u.searchParams.get('id')+(/^\d+$/.test(sku||'')?'&skuId='+sku:'');
    }
    u.hash='';return u.href;
  }catch(e){return '';}
}
/* Gợi ý mã tạm kế tiếp theo mã SP lớn nhất đang có (SP27004 → SP27005). */
function maGoiY(){
  let lon=0,dai=0;
  for(const h of S.ds){const m=/^SP(\d{3,8})$/.exec(h.ma||'');if(m&&Number(m[1])>lon){lon=Number(m[1]);dai=m[1].length;}}
  return lon?'SP'+String(lon+1).padStart(dai,'0'):'';
}
async function chep(v,nut){try{await navigator.clipboard.writeText(v);nut.textContent='Đã chép';}catch(e){nut.textContent='Không chép được';}setTimeout(()=>{nut.textContent='Chép';},1500);}

/* ---------- dữ liệu giả cho bản chạy thử ---------- */
let MOCK=null;
function mockAnh(chu,mau){
  const svg='<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400"><rect width="400" height="400" fill="'+mau+'"/><text x="200" y="215" font-family="Arial" font-size="42" font-weight="700" fill="#fff" text-anchor="middle">'+chu+'</text></svg>';
  return 'data:image/svg+xml;base64,'+btoa(svg);
}
function mock(){
  const nay=new Date().toISOString();
  const hs=(id,ma,ten,tt,x)=>Object.assign({id,ma,ma_chinh_thuc:null,ten,thuong_hieu:'Magickids',gioi:'trai',loai:'Áo',mua:'Xuân Hè',nguon_loai:'taobao',
    nguon_link:'https://example.com/san-pham/'+id,nguon_shop:'Shop nguồn '+id,thong_tin_nguon:'',phan_tich:'',ly_do:'',chat_lieu:'',mau_sac:'',bang_size:'',
    co_mau_that:false,ngay_mau_ve:null,gia_ban:'',gia_nhap:'',link_goc:'',link_anh:'',link_video:'',link_shopee:'',so_anh:0,so_video:0,
    sua_tt:'chua_giao',sua_nguoi:'',sua_yeu_cau:'',sua_xong:null,mo_ta:'',luu_y:'',trang_thai:tt,ly_do_bo:'',nguoi_tao:'Người A',tao_luc:nay,cap_nhat_luc:nay,anh:null},x||{});
  const ds=[
    hs(1,'MAU27001','Áo polo dài tay phối cổ, phong cách học đường','dang_xem',{ly_do:'Dáng dễ mặc, hợp bé lớn',anh:'v1'}),
    hs(2,'MAU27002','Bộ áo khoác có mũ phối quần ống rộng','chon_lam',{gioi:'gai',loai:'Bộ',mua:'Thu Đông',link_goc:'https://example.com/thu-muc/2-goc',sua_tt:'dang_lam',sua_nguoi:'Người B',sua_yeu_cau:'Bỏ chữ trên ảnh, thêm mã ở góc, chỉnh màu cho đúng',anh:'v1'}),
    hs(3,'MAU27003','Quần dài ống rộng thể thao sọc','co_media',{loai:'Quần',link_goc:'https://example.com/thu-muc/3-goc',link_anh:'https://example.com/thu-muc/3-anh',link_video:'https://example.com/thu-muc/3-video',so_anh:9,so_video:1,sua_tt:'da_duyet',
      mo_ta:'Quần dài ống rộng, cạp chun, sọc dọc hai bên ống.\n- Dễ phối áo thun, áo nỉ\n- Mặc đi học, đi chơi',bang_size:'130: 22–27 kg\n140: 27–32 kg\n150: 32–38 kg',chat_lieu:'Chưa xác minh trên mẫu thật',mau_sac:'Ghi, Đen',gia_ban:'Dự kiến 2 mức, chờ chốt',gia_nhap:'(ví dụ) chờ báo giá',luu_y:'Chưa có mẫu thật: không cam kết chất liệu',anh:'v1'}),
    hs(4,'MAU27004','Chân váy xếp ly cạp chun','bo',{gioi:'gai',loai:'Váy',ly_do_bo:'Trùng kiểu với mẫu đã có'}),
    hs(5,'MAU27005','Áo len cổ tròn dệt kim','dang_xem',{mua:'Thu Đông',nguon_loai:'suu_tam',nguon_link:''})
  ];
  const mau=['#6d3fc4','#0f7b4b','#b26a00','#c62828','#2b6cb0'];
  const anh={};ds.forEach((h,i)=>{if(h.anh)anh[h.id]=mockAnh(h.ma.slice(-3),mau[i%5]);});
  return {ds,anh,nk:{1:[{luc:nay,nguoi:'Người A',vai:'lam',viec:'tao',tu:'',den:'dang_xem',ghi_chu:''}]},seq:5};
}
function mockGoi(method,body,qs){
  if(!MOCK)MOCK=mock();
  const vai=['lam','xem'].includes(Q.get('vai'))?Q.get('vai'):'quan_ly';
  if(method==='GET'){
    if(qs&&qs.startsWith('nhatky='))return {status:200,body:{ds:MOCK.nk[qs.slice(7)]||[]}};
    let ds=JSON.parse(JSON.stringify(MOCK.ds));
    if(vai==='xem')ds=ds.filter(h=>h.trang_thai==='co_media');
    if(vai!=='quan_ly')ds.forEach(h=>delete h.gia_nhap);
    return {status:200,body:{at:Date.now(),vai,ds}};
  }
  const nay=new Date().toISOString(),ghi=(id,viec,tu,den,gc)=>{(MOCK.nk[id]=MOCK.nk[id]||[]).unshift({luc:nay,nguoi:body.nguoi,vai,viec,tu:tu||'',den:den||'',ghi_chu:gc||''});};
  if(body.action==='tao'){
    if(MOCK.ds.some(h=>h.ma===String(body.ma).toUpperCase()))return {status:400,body:{error:'Mã mẫu '+body.ma+' đã có hồ sơ'}};
    const h=Object.assign(mock().ds[0],{id:++MOCK.seq,anh:null,trang_thai:'dang_xem',ten:'',thuong_hieu:'',gioi:'',loai:'',mua:'',nguon_link:'',nguon_shop:'',ly_do:'',tao_luc:nay,cap_nhat_luc:nay,nguoi_tao:body.nguoi});
    for(const k in body)if(k!=='action'&&k!=='nguoi'&&k in h)h[k]=body[k];
    h.ma=String(body.ma).toUpperCase();MOCK.ds.unshift(h);ghi(h.id,'tao','','dang_xem');
    return {status:200,body:{ok:true,id:h.id}};
  }
  const h=MOCK.ds.find(x=>x.id===body.id);
  if(!h)return {status:404,body:{error:'Không có hồ sơ mẫu này'}};
  h.cap_nhat_luc=nay;
  if(body.action==='sua'){for(const k in body)if(k in h&&k!=='id')h[k]=body[k];ghi(h.id,'sua','','','(lưu thử)');}
  else if(body.action==='trang_thai'){
    if((body.den==='bo'||h.trang_thai==='bo')&&String(body.ghi_chu||'').trim().length<3)return {status:400,body:{error:'Cần ghi lý do (ít nhất 3 ký tự)'}};
    if(body.den==='co_media'){const th=thieu(h);if(th.length)return {status:400,body:{error:'Chưa đủ để coi là đã có media, còn thiếu: '+th.join(', ')}};}
    ghi(h.id,'trang_thai',h.trang_thai,body.den,body.ghi_chu);h.ly_do_bo=body.den==='bo'?body.ghi_chu:'';h.trang_thai=body.den;
  }else if(body.action==='anh'){h.anh=nay;MOCK.anh[h.id]=body.du_lieu;ghi(h.id,'anh');}
  return {status:200,body:{ok:true}};
}

/* ---------- gọi máy chủ ---------- */
async function goi(method,body,qs){
  if(THU){await new Promise(r=>setTimeout(r,150));return mockGoi(method,body,qs);}
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),25000);
  try{
    const r=await fetch(API+(qs?'?'+qs:''),{method,cache:'no-store',signal:ctl.signal,
      headers:Object.assign({'x-mk-key':S.key},body?{'content-type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
    let j=null;try{j=await r.json();}catch(e){}
    return {status:r.status,body:j||{}};
  }finally{clearTimeout(t);}
}
const loiMang=e=>e&&e.name==='AbortError'?'quá thời gian chờ':'không kết nối được máy chủ';

/* Ảnh đại diện cần mã truy cập nên tải bằng fetch rồi gắn vào thẻ img; nhớ theo id + dấu phiên bản. */
function ganAnh(img,h){
  if(!h.anh)return false;
  if(THU){img.src=MOCK.anh[h.id]||'';return true;}
  const khoa=h.id+'|'+h.anh,co=S.anh.get(khoa);
  if(co){img.src=co;return true;}
  fetch(API+'?anh='+h.id+'&v='+encodeURIComponent(h.anh),{headers:{'x-mk-key':S.key}})
    .then(r=>r.ok?r.blob():null).then(b=>{if(!b)return;const u=URL.createObjectURL(b);S.anh.set(khoa,u);img.src=u;}).catch(()=>{});
  return true;
}
function khungAnh(h){
  const k=mk('div','hinh');
  if(h.anh){const img=mk('img');img.alt='Ảnh đại diện '+h.ma;img.loading='lazy';ganAnh(img,h);k.append(img);}
  else k.textContent='Chưa có ảnh';
  return k;
}
/* Thu nhỏ ảnh trong trình duyệt (cạnh dài 480px, JPEG) trước khi gửi: chỉ là ảnh đại diện, ảnh gốc vẫn ở kho lưu trữ. */
function thuNho(file){
  return new Promise((ok,loi)=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return loi(new Error('Chọn ảnh JPG, PNG hoặc WEBP'));
    const u=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      const tile=Math.min(1,480/Math.max(img.width,img.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.width*tile));c.height=Math.max(1,Math.round(img.height*tile));
      const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>{URL.revokeObjectURL(u);loi(new Error('Không đọc được ảnh này'));};
    img.src=u;
  });
}

function hoiMa(msg){
  $('app').hidden=true;$('gate').hidden=false;$('gateMsg').textContent=msg||'';$('keyIn').value='';
  try{$('keyIn').focus();}catch(e){}
}
async function tai(){
  if(S.busy)return;
  if(!THU&&!S.key){hoiMa('');return;}
  $('gate').hidden=true;$('app').hidden=false;
  S.busy=true;S.err='';ve();
  try{
    const r=await goi('GET');
    if(r.status===401){S.key='';store.set('mk_mau_key','');S.busy=false;hoiMa('Mã truy cập không đúng. Nhập lại mã Magickids đã cấp.');return;}
    if(r.status!==200||!r.body||!Array.isArray(r.body.ds))throw new Error(r.body&&r.body.error||'máy chủ không trả danh sách');
    S.ds=r.body.ds;S.vai=r.body.vai;S.at=Date.now();
  }catch(e){S.err='Chưa đọc được danh sách ('+(e.message&&e.name!=='AbortError'&&e.name!=='TypeError'?e.message:loiMang(e))+'). Bấm "Tải lại".';}
  S.busy=false;ve();
}

function ve(){
  const info=$('info'),body=$('body');body.textContent='';
  const tenVai={quan_ly:'quản lý',lam:'người làm',xem:'chỉ xem'}[S.vai]||'';
  info.textContent=S.err||(S.busy&&!S.at?'Đang đọc danh sách mẫu…':S.at?('Lấy lúc '+hhmm(S.at)+(S.busy?' · đang tải lại…':'')+(tenVai?' · vai: '+tenVai:'')+'. Ảnh, video nằm ở kho lưu trữ; trang này chỉ giữ đường dẫn.'):'');
  info.classList.toggle('err',!!S.err);
  if(!S.at)return;
  if(S.them){body.append(S.them==='day'?veForm(null):veThemNhanh());return;}
  const h=S.mo!=null?S.ds.find(x=>x.id===S.mo):null;
  if(h){body.append(veHoSo(h));return;}
  /* đang tải lại thì giữ S.mo: hồ sơ vừa thêm chưa có trong danh sách cũ */

  hop.append(mk('label',null,'Dán link sản phẩm, hoặc cả đoạn chia sẻ từ app'));

  dan.addEventListener('input',soi);

  nutDan.hidden=!(navigator.clipboard&&navigator.clipboard.readText);
  nutDan.addEventListener('click',async()=>{try{const t=await navigator.clipboard.readText();if(t){dan.value=t;soi();}}catch(e){nhan.className='nhanlk chua';nhan.textContent='Máy không cho đọc bộ nhớ tạm; nhấn giữ vào ô trên rồi chọn Dán.';}});
  hop.append(dan,nutDan,nhan);

  hop.append(mk('label',null,'Mã mẫu (mã tạm)'));
  const ma=mk('input');ma.maxLength=30;ma.autocapitalize='characters';ma.spellcheck=false;ma.placeholder='SP27001';ma.value=maGoiY();hop.append(ma);

  const seg=(nhanO,khoa,ds)=>{
    hop.append(mk('label',null,nhanO));const g=mk('div','seg');

    }catch(e){m.className='msg err';m.textContent=e.name==='AbortError'||e.name==='TypeError'?loiMang(e):e.message;luu.disabled=false;}

    const top=mk('div','bar');const b=mk('button',null,'← Danh sách');b.type='button';b.addEventListener('click',()=>{S.them=false;ve();});top.append(b);w.append(top);
    const hop=mk('div','hop');hop.append(mk('h3',null,'Thêm mẫu mới'));
    const l=mk('label',null,'Mã mẫu (mã tạm, ví dụ SP27005)');const i=mk('input');i.maxLength=30;i.autocapitalize='characters';i.spellcheck=false;
    hop.append(l,i,mk('div','m','Mã tạm dùng tới khi cho sản xuất mới cấp mã chính thức. Mẫu mới vào trạng thái "Đang xem".'));o.ma=i;w.append(hop);
  }
  for(const [ten,mo,ds] of NHOM){
    const d=mk('details','nhom');d.open=moi?(ten==='Nhận diện'||ten==='Nguồn mẫu'):mo;d.append(mk('summary',null,ten));
    const trong=mk('div');
    for(const [k,nhan,kieu,opt] of ds){
      if(k==='gia_nhap'&&S.vai!=='quan_ly')continue;
      const gt=h?h[k]:(k==='nguon_loai'?'taobao':k==='sua_tt'?'chua_giao':k==='thuong_hieu'?'':k==='gioi'?'':undefined);
      let i;
      if(kieu==='bool'){const l=mk('label');i=mk('input');i.type='checkbox';i.checked=!!gt;l.append(i,document.createTextNode(' '+nhan));trong.append(l);o[k]=i;continue;}
      trong.append(mk('label',null,nhan));
      if(kieu==='chon'){i=mk('select');for(const v in opt){const op=mk('option',null,opt[v]);op.value=v;if(v==='da_duyet'&&S.vai!=='quan_ly')op.disabled=true;i.append(op);}i.value=gt==null?'':gt;}
      else if(kieu==='area'){i=mk('textarea');i.maxLength=opt;i.value=gt||'';if(opt>=4000)i.style.minHeight='140px';}
      else{i=mk('input');i.type=kieu==='date'?'date':kieu==='num'?'number':kieu==='link'?'url':'text';if(kieu==='num'){i.min=0;i.max=99999;}if(kieu==='text')i.maxLength=opt;if(kieu==='link'){i.maxLength=600;i.placeholder='https://…';}i.value=gt==null?'':gt;}
      trong.append(i);o[k]=i;
    }
    d.append(trong);w.append(d);
  }
  const hop=mk('div','hop'),m=mk('div','msg'),luu=mk('button','primary',moi?'Thêm mẫu':'Lưu hồ sơ');luu.type='button';
  hop.append(oTen(),m);const nut=mk('div','nut');nut.append(luu);hop.append(nut);w.append(hop);
  luu.addEventListener('click',async()=>{
    const nguoi=layTen(m);if(!nguoi)return;
    const body={action:moi?'tao':'sua',nguoi};
    if(moi)body.ma=o.ma.value.trim().toUpperCase();else body.id=h.id;
    for(const k in o){
      if(k==='ma')continue;
      const i=o[k],v=i.type==='checkbox'?i.checked:i.type==='number'?(i.value===''?0:Number(i.value)):i.value.trim();
      const cu=h?(h[k]==null?(i.type==='checkbox'?false:i.type==='number'?0:''):h[k]):undefined;
      if(moi?(v!==''&&v!==false&&v!==0||k==='nguon_loai'):v!==cu)body[k]=v;
    }
    if(!moi&&Object.keys(body).length===3){m.className='msg';m.textContent='Chưa đổi gì.';return;}
    luu.disabled=true;m.className='msg';m.textContent='Đang lưu…';
    try{
      const r=await goi('POST',body);
      if(r.status!==200)throw new Error(r.body.error||'máy chủ chưa lưu được');
      if(moi){S.them=false;S.mo=r.body.id;S.loc='tat';}
      S.nk=null;await tai();
      if(!moi){const m2=document.querySelector('#body .msg.luu');if(m2){m2.className='msg ok luu';m2.textContent='Đã lưu lúc '+hhmm(Date.now())+'.';}}
    }catch(e){m.className='msg err';m.textContent=e.name==='AbortError'||e.name==='TypeError'?loiMang(e):e.message;luu.disabled=false;}
  });
  m.classList.add('luu');
  return w;
}

function veNhatKy(h){
  const d=mk('details','nhom');d.append(mk('summary',null,'Nhật ký'));const trong=mk('div');d.append(trong);
  const VIEC={tao:'Thêm mẫu',sua:'Sửa hồ sơ',trang_thai:'Đổi trạng thái',anh:'Đổi ảnh đại diện'};
  const veDs=ds=>{
    trong.textContent='';
    if(!ds.length){trong.append(mk('div','m','Chưa có dòng nào.'));return;}
    for(const x of ds){
      let t=ngayGio(x.luc)+' · '+x.nguoi+' · '+(VIEC[x.viec]||x.viec);
      if(x.viec==='trang_thai')t+=': '+(TT[x.tu]||x.tu)+' → '+(TT[x.den]||x.den);
      if(x.ghi_chu)t+=' · '+x.ghi_chu;
      trong.append(mk('div','nk',t));
    }
  };
  d.addEventListener('toggle',async()=>{
    if(!d.open)return;
    if(S.nk&&S.nk.id===h.id){veDs(S.nk.ds);return;}
    trong.textContent='Đang đọc nhật ký…';
    try{
      const r=await goi('GET',null,'nhatky='+h.id);
      if(r.status!==200||!Array.isArray(r.body.ds))throw new Error(r.body.error||'');
      S.nk={id:h.id,ds:r.body.ds};veDs(r.body.ds);
    }catch(e){trong.textContent='Chưa đọc được nhật ký.';}
  });
  return d;
}
